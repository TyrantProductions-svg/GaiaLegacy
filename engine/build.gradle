plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

group = 'com.overlord'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    def lwjglVersion = '3.3.3'
    def jomlVersion = '1.10.5'
    def osName = System.getProperty('os.name').toLowerCase()
    def osArch = System.getProperty('os.arch').toLowerCase()

    def isArm64 = osArch.contains('aarch64') || osArch.contains('arm64')

    def lwjglNatives

    if (osName.contains('win')) {
        lwjglNatives = isArm64
            ? 'natives-windows-arm64'
            : 'natives-windows'
    } else if (osName.contains('mac')) {
        lwjglNatives = isArm64
            ? 'natives-macos-arm64'
            : 'natives-macos'
    } else if (osName.contains('linux')) {
        lwjglNatives = isArm64
            ? 'natives-linux-arm64'
            : 'natives-linux'
    } else {
        throw new GradleException(
            "Unsupported operating system: ${System.getProperty('os.name')} " +
            "${System.getProperty('os.arch')}"
        )
    }

    println "Using LWJGL natives: ${lwjglNatives}"

    api platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    api "org.lwjgl:lwjgl"
    api "org.lwjgl:lwjgl-glfw"
    api "org.lwjgl:lwjgl-openal"
    api "org.lwjgl:lwjgl-opengl"
    api "org.lwjgl:lwjgl-stb"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"

    api "org.joml:joml:$jomlVersion"

    testImplementation "org.junit.jupiter:junit-jupiter:6.1.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

tasks.register('verifyPackagedShaderResources') {
    dependsOn tasks.named('jar')
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        def required = [
            'assets/overlord/shaders/world.vert',
            'assets/overlord/shaders/world.frag',
            'assets/overlord/shaders/sky.vert',
            'assets/overlord/shaders/sky.frag',
            'assets/overlord/shaders/feedback/block_damage.vert',
            'assets/overlord/shaders/feedback/block_damage.frag',
            'assets/overlord/shaders/feedback/particle.vert',
            'assets/overlord/shaders/feedback/particle.frag',
            'assets/overlord/shaders/feedback/world_item.vert',
            'assets/overlord/shaders/feedback/world_item.frag',
            'assets/overlord/shaders/ui/ui.vert',
            'assets/overlord/shaders/ui/ui.frag'
        ]
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            required.each { path ->
                if (zip.getEntry(path) == null) {
                    throw new GradleException(
                        "Packaged engine JAR is missing ${path}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyPackagedShaderResources')
}
