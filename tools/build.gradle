def runtimeHeroDirectory = rootProject.layout.projectDirectory.dir(
    'game/src/main/resources/assets/gaia/ui/hero')

def runtimeBrandDirectory = rootProject.layout.projectDirectory.dir(
    'game/src/main/resources/assets/gaia/ui/brand')

tasks.register('generateRuntimeBrandAssets', JavaExec) {
    group = 'asset generation'
    description = 'Rasterizes the project-owned Gaia vector/path emblem at 4x coverage.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.ui.RuntimeBrandAssetGenerator'
    args runtimeBrandDirectory.asFile.absolutePath
}

tasks.register('verifyGeneratedRuntimeBrand') {
    group = 'verification'
    description = 'Checks independent JVM brand generation and repository asset equality.'
    dependsOn tasks.named('classes')
    doLast {
        def root = layout.buildDirectory.dir('runtime-brand-verification').get().asFile
        def destinations = ['first', 'second'].collect { new File(root, it) }
        destinations.each { destination ->
            project.javaexec {
                classpath = sourceSets.main.runtimeClasspath
                mainClass = 'com.gaia.tools.ui.RuntimeBrandAssetGenerator'
                args destination.absolutePath
            }
        }
        ['gaia-emblem.png', 'brand-manifest.json'].each { name ->
            def first = destinations[0].toPath().resolve(name)
            [destinations[1].toPath().resolve(name),
                    runtimeBrandDirectory.asFile.toPath().resolve(name)].each { other ->
                if (java.nio.file.Files.mismatch(first, other) != -1L) {
                    throw new GradleException("Runtime brand ${name} differs")
                }
            }
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyGeneratedRuntimeBrand') }

tasks.register('generateRuntimeHeroAssets', JavaExec) {
    group = 'asset generation'
    description = 'Generates the deterministic project-owned A+ runtime hero pages.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.ui.RuntimeHeroAssetGenerator'
    args runtimeHeroDirectory.asFile.absolutePath,
        rootProject.file('docs/images/gaialegacy-hero.png').absolutePath
}

tasks.register('verifyGeneratedRuntimeHeroes') {
    group = 'verification'
    description = 'Regenerates runtime heroes twice and compares checked-in bytes.'
    dependsOn tasks.named('classes')
    doLast {
        def verificationRoot = layout.buildDirectory
            .dir('runtime-hero-verification').get().asFile
        def first = new File(verificationRoot, 'first')
        def second = new File(verificationRoot, 'second')
        delete verificationRoot
        [first, second].each { destination ->
            project.javaexec {
                classpath = sourceSets.main.runtimeClasspath
                mainClass = 'com.gaia.tools.ui.RuntimeHeroAssetGenerator'
                args destination.absolutePath,
                    rootProject.file('docs/images/gaialegacy-hero.png').absolutePath
            }
        }
        def names = [
            'gaia-hero-dawn.png',
            'gaia-hero-highlands.png',
            'gaia-hero-twilight.png',
            'hero-manifest.json'
        ]
        names.each { name ->
            def firstPath = first.toPath().resolve(name)
            def secondPath = second.toPath().resolve(name)
            if (java.nio.file.Files.mismatch(firstPath, secondPath) != -1L) {
                throw new GradleException("Runtime hero ${name} is not deterministic")
            }
            def checkedIn = runtimeHeroDirectory.asFile.toPath().resolve(name)
            if (!java.nio.file.Files.isRegularFile(checkedIn)
                    || java.nio.file.Files.mismatch(firstPath, checkedIn) != -1L) {
                throw new GradleException(
                    "Runtime hero ${name} differs from checked-in bytes")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyGeneratedRuntimeHeroes')
}
