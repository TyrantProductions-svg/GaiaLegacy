name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean test build

      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew clean test build

  streaming-race-diagnostic:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'fix/streaming-probe-diagnostic-race'
    name: Streaming race diagnostic (${{ matrix.os }}, sample ${{ matrix.sample }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        sample:
          - 1
          - 2
          - 3
          - 4
          - 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run production streaming probe in a fresh JVM
        run: >-
          ./gradlew clean :game:test
          --tests "*ChunkStreamingPerformanceMeasurementTest"
          --console=plain --no-daemon --stacktrace

      - name: Print failed test reports
        if: failure()
        run: >-
          find game/build/test-results/test -type f -name '*.xml'
          -exec cat {} \;
