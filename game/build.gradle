plugins {
    id 'application'
}

group = 'com.gaia'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def osName = System.getProperty('os.name').toLowerCase()

def defaultJvmArgs = [
    '--enable-native-access=ALL-UNNAMED'
]

if (osName.contains('mac')) {
    defaultJvmArgs.add('-XstartOnFirstThread')
}

application {
    mainClass = 'com.gaia.GaiaMain'
    applicationDefaultJvmArgs = defaultJvmArgs
}

dependencies {
    implementation project(':engine')
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation(testFixtures(project(':engine')))
    testImplementation "org.junit.jupiter:junit-jupiter:6.1.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// Ship complete upstream notices with the derived font pages, without a tools runtime dependency.
tasks.named('processResources') {
    from(rootProject.file('tools/src/main/resources/ui-source/fonts/pixelify/OFL.txt')) {
        into 'assets/gaia/ui/licenses'
        rename { 'pixelify-OFL.txt' }
    }
    from(rootProject.file('tools/src/main/resources/ui-source/fonts/inter/LICENSE.txt')) {
        into 'assets/gaia/ui/licenses'
        rename { 'inter-LICENSE.txt' }
    }
}

tasks.named('run') {
    if (project.hasProperty('gaiaInventoryDebugCommand')) {
        systemProperty 'gaia.inventory.debugCommand',
            project.property('gaiaInventoryDebugCommand')
    }
    if (project.hasProperty('gaiaInventoryDebugShortcuts')) {
        systemProperty 'gaia.inventory.debugShortcuts',
            project.property('gaiaInventoryDebugShortcuts')
    }
}

tasks.register('verifyPackagedResources') {
    dependsOn tasks.named('jar')
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        def required = [
            'META-INF/gaialegacy/resource-indexes.list',
            'assets/gaia/resource-index.json',
            'assets/gaia/blocks/air.json',
            'assets/gaia/blocks/grass.json',
            'assets/gaia/blocks/dirt.json',
            'assets/gaia/blocks/stone.json',
            'assets/gaia/items/chisel.json',
            'assets/gaia/items/stone_detail_unit.json',
            'assets/gaia/items/dirt_detail_unit.json',
            'assets/gaia/materials/opaque.json',
            'assets/gaia/materials/missing.json',
            'assets/gaia/atlases/blocks.json',
            'assets/gaia/textures/atlas.png',
            'assets/gaia/textures/effects/block_damage.png',
            'assets/gaia/audio/music/gaia.ogg',
            'assets/gaia/audio/music/legacy.ogg',
            'assets/gaia/ui/ui-assets.json',
            'assets/gaia/ui/licenses/pixelify-OFL.txt',
            'assets/gaia/ui/licenses/inter-LICENSE.txt',
            'assets/gaia/ui/ui_font.png',
            'assets/gaia/ui/ui_font.json',
            'assets/gaia/ui/ui_font_body.png',
            'assets/gaia/ui/ui_font_display.png',
            'assets/gaia/ui/ui_typography.json',
            'assets/gaia/ui/brand/gaia-emblem.png',
            'assets/gaia/ui/brand/brand-manifest.json',
            'assets/gaia/ui/hero/gaia-hero-dawn.png',
            'assets/gaia/ui/hero/gaia-hero-highlands.png',
            'assets/gaia/ui/hero/gaia-hero-twilight.png',
            'assets/gaia/ui/hero/hero-manifest.json',
            'assets/gaia/ui/ui_icons.png',
            'assets/gaia/ui/ui_icons.json'
        ]
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            required.each { path ->
                if (zip.getEntry(path) == null) {
                    throw new GradleException(
                        "Packaged game JAR is missing ${path}")
                }
            }
            def packagedMp3 = zip.entries().findAll { entry ->
                !entry.directory
                    && entry.name.toLowerCase(java.util.Locale.ROOT).endsWith('.mp3')
            }
            if (!packagedMp3.isEmpty()) {
                throw new GradleException(
                    "Packaged game JAR must not contain source MP3 files: "
                        + "${packagedMp3*.name}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyPackagedResources')
}

tasks.register('verifyInstalledAudioRuntime') {
    if (!providers.gradleProperty('gaiaAudioAuditRoot').isPresent()) {
        dependsOn tasks.named('installDist')
    }
    doLast {
        def auditRoot = providers.gradleProperty('gaiaAudioAuditRoot')
            .map { file(it) }
            .getOrElse(file('build/install/game'))
        def libraryDirectory = new File(auditRoot, 'lib')
        def resolvedOpenAl = configurations.runtimeClasspath
            .resolvedConfiguration
            .resolvedArtifacts
            .findAll { artifact ->
                artifact.moduleVersion.id.group == 'org.lwjgl'
                    && artifact.name == 'lwjgl-openal'
            }
        def resolvedApi = resolvedOpenAl.findAll { artifact ->
            artifact.classifier == null
        }
        if (resolvedApi.size() != 1) {
            throw new GradleException(
                'AUDIO_INSTALL_OPENAL_API_SET_MISMATCH '
                    + "expected exactly one resolved API, actual=${resolvedApi*.file*.name}")
        }
        def resolvedNative = resolvedOpenAl.findAll { artifact ->
            artifact.classifier != null
        }
        if (resolvedNative.size() != 1) {
            throw new GradleException(
                'AUDIO_INSTALL_OPENAL_NATIVE_SET_MISMATCH '
                    + "expected exactly one resolved native, actual=${resolvedNative*.file*.name}")
        }

        def expectedApi = [resolvedApi[0].file.name] as Set
        def expectedNative = [resolvedNative[0].file.name] as Set
        def installedOpenAl = fileTree(libraryDirectory) {
            include 'lwjgl-openal-*.jar'
        }.files.collect { it.name } as Set
        def installedApi = installedOpenAl.findAll { name ->
            !name.contains('-natives-')
        } as Set
        def installedNative = installedOpenAl.findAll { name ->
            name.contains('-natives-')
        } as Set
        if (installedApi != expectedApi) {
            throw new GradleException(
                'AUDIO_INSTALL_OPENAL_API_SET_MISMATCH '
                    + "expected=${expectedApi.sort()} actual=${installedApi.sort()}")
        }
        if (installedNative != expectedNative) {
            throw new GradleException(
                'AUDIO_INSTALL_OPENAL_NATIVE_SET_MISMATCH '
                    + "expected=${expectedNative.sort()} actual=${installedNative.sort()}")
        }

        def looseMp3 = fileTree(auditRoot).files.findAll { installed ->
            installed.name.toLowerCase(java.util.Locale.ROOT).endsWith('.mp3')
        }.collect { installed ->
            auditRoot.toPath().relativize(installed.toPath()).toString()
        }.sort()
        if (!looseMp3.isEmpty()) {
            throw new GradleException(
                "AUDIO_INSTALL_MP3_FORBIDDEN paths=${looseMp3}")
        }

        println(
            'AUDIO_INSTALL_AUDIT_OK '
                + "api=${resolvedApi[0].file.name} "
                + "native=${resolvedNative[0].file.name}")
    }
}

tasks.register('verifyInstalledShaderResources') {
    dependsOn tasks.named('installDist')
    dependsOn tasks.named('verifyInstalledAudioRuntime')
    doLast {
        def libraryDirectory = file('build/install/game/lib')
        def engineJars = fileTree(libraryDirectory) {
            include 'engine-*.jar'
        }.files.sort()
        if (engineJars.size() != 1) {
            throw new GradleException(
                "Expected exactly one installed engine JAR in "
                    + "${libraryDirectory}, found ${engineJars}")
        }

        def engineJar = engineJars[0]
        def required = [
            'assets/overlord/shaders/world.vert',
            'assets/overlord/shaders/world.frag',
            'assets/overlord/shaders/sky.vert',
            'assets/overlord/shaders/sky.frag',
            'assets/overlord/shaders/feedback/block_damage.vert',
            'assets/overlord/shaders/feedback/block_damage.frag',
            'assets/overlord/shaders/feedback/particle.vert',
            'assets/overlord/shaders/feedback/particle.frag',
            'assets/overlord/shaders/feedback/world_item.vert',
            'assets/overlord/shaders/feedback/world_item.frag',
            'assets/overlord/shaders/ui/ui.vert',
            'assets/overlord/shaders/ui/ui.frag'
        ]
        new java.util.zip.ZipFile(engineJar).withCloseable { zip ->
            required.each { path ->
                if (zip.getEntry(path) == null) {
                    throw new GradleException(
                        "Installed engine JAR is missing ${path}")
                }
            }
        }

        def gameJars = fileTree(libraryDirectory) {
            include 'game-*.jar'
        }.files.sort()
        if (gameJars.size() != 1) {
            throw new GradleException(
                "Expected exactly one installed game JAR in "
                    + "${libraryDirectory}, found ${gameJars}")
        }
        def gameJar = gameJars[0]
        def requiredGameResources = [
            'META-INF/gaialegacy/resource-indexes.list',
            'assets/gaia/resource-index.json',
            'assets/gaia/items/chisel.json',
            'assets/gaia/items/stone_detail_unit.json',
            'assets/gaia/items/dirt_detail_unit.json',
            'assets/gaia/audio/music/gaia.ogg',
            'assets/gaia/audio/music/legacy.ogg',
            'assets/gaia/ui/ui-assets.json',
            'assets/gaia/ui/licenses/pixelify-OFL.txt',
            'assets/gaia/ui/licenses/inter-LICENSE.txt',
            'assets/gaia/ui/ui_font.png',
            'assets/gaia/ui/ui_font.json',
            'assets/gaia/ui/ui_font_body.png',
            'assets/gaia/ui/ui_font_display.png',
            'assets/gaia/ui/ui_typography.json',
            'assets/gaia/ui/brand/gaia-emblem.png',
            'assets/gaia/ui/brand/brand-manifest.json',
            'assets/gaia/ui/hero/gaia-hero-dawn.png',
            'assets/gaia/ui/hero/gaia-hero-highlands.png',
            'assets/gaia/ui/hero/gaia-hero-twilight.png',
            'assets/gaia/ui/hero/hero-manifest.json',
            'assets/gaia/ui/ui_icons.png',
            'assets/gaia/ui/ui_icons.json'
        ]
        new java.util.zip.ZipFile(gameJar).withCloseable { zip ->
            requiredGameResources.each { path ->
                if (zip.getEntry(path) == null) {
                    throw new GradleException(
                        "Installed game JAR is missing ${path}")
                }
            }
            def packagedMp3 = zip.entries().findAll { entry ->
                !entry.directory
                    && entry.name.toLowerCase(java.util.Locale.ROOT).endsWith('.mp3')
            }
            if (!packagedMp3.isEmpty()) {
                throw new GradleException(
                    "Installed game JAR must not contain source MP3 files: "
                        + "${packagedMp3*.name}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyInstalledShaderResources')
}
