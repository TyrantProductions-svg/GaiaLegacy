plugins {
    id 'java'
}

group = 'com.gaia'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':engine')
    implementation project(':game')
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('generateUiAssets', JavaExec) {
    group = 'asset generation'
    description = 'Regenerates the Quiet Rune bitmap font and project-owned block icons.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.ui.UiAssetGenerator'
    workingDir = rootProject.projectDir
    args 'game/src/main/resources/assets/gaia/ui/ui_font.png',
        'game/src/main/resources/assets/gaia/ui/ui_font.json',
        'game/src/main/resources/assets/gaia/ui/ui_icons.png',
        'game/src/main/resources/assets/gaia/ui/ui_icons.json'
}

tasks.register('profileWorldItems', JavaExec) {
    group = 'verification'
    description = 'Runs the deterministic 10s warm-up and 60s Phase 11 allocation fixture.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.WorldItemPerformanceFixture'
    args '12345', '1024', '512', '600', '3600'
}

tasks.register('profileDetailVoxels', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic Phase 16 DETAIL resource measurements.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.DetailVoxelPerformanceFixture'
    args '1'
}

tasks.register('stressHybridMeshRetention', JavaExec) {
    group = 'verification'
    description = 'Runs the Phase 16 hybrid mesh lifecycle stress with a 512 MiB heap.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.HybridMeshRetentionStressFixture'
    maxHeapSize = '512m'
}

tasks.register('profileDetailEdits', JavaExec) {
    group = 'verification'
    description = 'Runs the bounded Phase 17 pressed-edge DETAIL edit fixture.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.DetailEditPerformanceFixture'
    args '120', '0'
}

def generatedUiVerificationDir = layout.buildDirectory.dir(
    'generated-ui-verification')

tasks.register('generateUiAssetsForVerification', JavaExec) {
    group = 'verification'
    description = 'Generates deterministic UI assets into build/ for comparison.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.ui.UiAssetGenerator'
    workingDir = project.projectDir
    outputs.dir generatedUiVerificationDir
    doFirst {
        delete generatedUiVerificationDir
    }
    args 'build/generated-ui-verification/ui_font.png',
        'build/generated-ui-verification/ui_font.json',
        'build/generated-ui-verification/ui_icons.png',
        'build/generated-ui-verification/ui_icons.json'
}

tasks.register('verifyGeneratedUiAssets') {
    group = 'verification'
    description = 'Byte-compares build-only regeneration with checked-in UI assets.'
    dependsOn tasks.named('generateUiAssetsForVerification')
    def sourceDirectory = rootProject.file(
        'game/src/main/resources/assets/gaia/ui')
    def names = [
        'ui_font.png',
        'ui_font.json',
        'ui_icons.png',
        'ui_icons.json'
    ]
    inputs.files names.collect { sourceDirectory.toPath().resolve(it).toFile() }
    doLast {
        def generatedDirectory = generatedUiVerificationDir.get().asFile.toPath()
        names.each { name ->
            def expected = sourceDirectory.toPath().resolve(name)
            def actual = generatedDirectory.resolve(name)
            if (!java.nio.file.Files.isRegularFile(actual)) {
                throw new GradleException(
                    "Generated UI verification output is missing ${actual}")
            }
            long mismatch = java.nio.file.Files.mismatch(expected, actual)
            if (mismatch != -1L) {
                throw new GradleException(
                    "Generated UI asset ${name} differs from checked-in bytes "
                        + "at byte ${mismatch}; run :tools:generateUiAssets "
                        + "only after an intentional asset change")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyGeneratedUiAssets')
}

def runtimeTypographyDirectory = rootProject.layout.projectDirectory.dir(
    'game/src/main/resources/assets/gaia/ui')

tasks.register('generateRuntimeTypographyAssets', JavaExec) {
    group = 'asset generation'
    description = 'Generates the approved Pixelify/Inter runtime typography pages.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.ui.RuntimeTypographyAssetGenerator'
    args runtimeTypographyDirectory.asFile.absolutePath
}

tasks.register('verifyGeneratedRuntimeTypography') {
    group = 'verification'
    description = 'Regenerates runtime typography twice and compares checked-in bytes.'
    dependsOn tasks.named('classes')
    doLast {
        def verificationRoot = layout.buildDirectory
            .dir('runtime-typography-verification').get().asFile
        def first = new File(verificationRoot, 'first')
        def second = new File(verificationRoot, 'second')
        delete verificationRoot
        [first, second].each { destination ->
            project.javaexec {
                classpath = sourceSets.main.runtimeClasspath
                mainClass = 'com.gaia.tools.ui.RuntimeTypographyAssetGenerator'
                args destination.absolutePath
            }
        }
        def names = ['ui_font_body.png', 'ui_font_display.png', 'ui_typography.json']
        names.each { name ->
            def firstPath = first.toPath().resolve(name)
            def secondPath = second.toPath().resolve(name)
            if (java.nio.file.Files.mismatch(firstPath, secondPath) != -1L) {
                throw new GradleException("Runtime typography ${name} is not deterministic")
            }
            def checkedIn = runtimeTypographyDirectory.asFile.toPath().resolve(name)
            if (!java.nio.file.Files.isRegularFile(checkedIn)
                    || java.nio.file.Files.mismatch(firstPath, checkedIn) != -1L) {
                throw new GradleException(
                    "Runtime typography ${name} differs from checked-in bytes")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyGeneratedRuntimeTypography')
}

def phase175SpecimenDir = layout.buildDirectory.dir('phase-17.5-specimen')

tasks.register('generatePhase175TypographySpecimen', JavaExec) {
    group = 'asset generation'
    description = 'Generates the deterministic Phase 17.5 Quiet Rune/A/B typography specimen.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.gaia.tools.ui.TypographySpecimenGenerator'
    outputs.dir phase175SpecimenDir
    doFirst {
        delete phase175SpecimenDir
    }
    args phase175SpecimenDir.get().asFile.absolutePath
}

tasks.register('verifyPhase175TypographySpecimen') {
    group = 'verification'
    description = 'Generates the Phase 17.5 specimen twice and byte-compares every output.'
    dependsOn tasks.named('classes')
    doLast {
        def verificationRoot = layout.buildDirectory
            .dir('phase-17.5-specimen-verification').get().asFile
        def first = new File(verificationRoot, 'first')
        def second = new File(verificationRoot, 'second')
        delete verificationRoot
        [first, second].each { destination ->
            project.javaexec {
                classpath = sourceSets.main.runtimeClasspath
                mainClass = 'com.gaia.tools.ui.TypographySpecimenGenerator'
                args destination.absolutePath
            }
        }
        def firstFiles = fileTree(first).files.collect {
            first.toPath().relativize(it.toPath()).toString().replace('\\', '/')
        }.sort()
        def secondFiles = fileTree(second).files.collect {
            second.toPath().relativize(it.toPath()).toString().replace('\\', '/')
        }.sort()
        if (firstFiles != secondFiles) {
            throw new GradleException('Independent typography specimen file rosters differ')
        }
        firstFiles.each { relative ->
            def mismatch = java.nio.file.Files.mismatch(
                first.toPath().resolve(relative), second.toPath().resolve(relative))
            if (mismatch != -1L) {
                throw new GradleException(
                    "Typography specimen ${relative} differs at byte ${mismatch}")
            }
        }
    }
}

